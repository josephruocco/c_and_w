<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111813">
  <title>Chabad & Weave</title>
  <link rel="stylesheet" href="style.css?v=title-2">
</head>
<body>
  <main class="arcade" aria-label="Chabad and Weave game">
    <div class="screen">
      <canvas id="game" width="1200" height="540" aria-label="Running game. Arrows move, Space jumps, Down enters tunnels, P pauses."></canvas>
      <div class="scorebar">
        <div class="location"><b id="zone">PROSPECT PARK</b></div>
        <div class="stats">
          <span>RUN <b id="distance">0000 m</b></span>
          <span>FOCUS <b id="focus">● ● ●</b></span>
          <span>BEST <b id="best">0000 m</b></span>
        </div>
        <div class="menu-controls">
          <button id="sound" aria-pressed="false" aria-label="Enable sound">SOUND OFF</button>
          <button id="pause" aria-label="Pause game">Ⅱ</button>
        </div>
      </div>
      <div id="overlay" class="overlay">
        <span id="overlay-tag">CHABAD & WEAVE</span>
        <h1 id="overlay-title"><span class="title-line">CHABAD<span class="title-amp">&amp;</span></span><br><span>WEAVE</span></h1>
        <p id="overlay-text">Run either way. Hold jump to climb the clouds.</p>
        <button id="start">START RUN</button>
        <small id="overlay-hint">PRESS SPACE</small>
      </div>
      <div id="conversation" class="conversation hidden" role="dialog" aria-modal="true" aria-labelledby="conversation-question">
        <p id="conversation-question">Are you Jewish?</p>
        <button id="decline">Respectfully decline</button>
      </div>
      <div id="toast" role="status"></div>
      <div class="controlbar" aria-label="Keyboard controls">
        <span><kbd>← →</kbd> TURN</span>
        <span><kbd>SPACE</kbd> JUMP / HOLD TO CLIMB</span>
        <span><kbd>↓</kbd> TUNNEL</span>
        <span><kbd>P</kbd> PAUSE</span>
      </div>
    </div>
    <div class="touch-controls" aria-label="Touch controls">
      <button data-key="ArrowLeft" aria-label="Move left">←</button>
      <button data-key="ArrowRight" aria-label="Move right">→</button>
      <button data-key="ArrowDown" aria-label="Enter tunnel">↓</button>
      <button data-key="Space">JUMP</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
